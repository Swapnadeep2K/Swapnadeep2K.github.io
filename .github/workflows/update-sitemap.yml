name: Update sitemap dates

on:
  push:
    branches: [master]
    paths-ignore:
      - sitemap.xml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate sitemap
        shell: pwsh
        run: ./.github/scripts/generate-sitemap.ps1

      - name: Commit sitemap changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --cached --quiet || git commit -m "chore: update sitemap dates"
          git push